name: Daily News Fetch

on:
  schedule:
    # 台灣時間 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 (對應 UTC 22:00, 01:00, 04:00, 07:00, 10:00, 13:00)
    - cron: "0 1,4,7,10,13,22 * * *"
  workflow_dispatch:   # 允許手動觸發

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily news fetch
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID:          ${{ secrets.SHEET_ID }}
          USE_AI:            "false"
          GEMINI_MODEL:      "gemini-2.0-flash-lite"
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID:       ${{ secrets.LINE_USER_ID }}
        run: python news_daily.py
